.door-c.dr{right:0}

.dr .door-trim{left:0}

.dr .door-knob{left:22px}

.wedding-art{display:block;width:min(390px,82vw);height:auto;margin:8px auto 4px;filter:drop-shadow(0 14px 35px rgba(201,150,26,.16));animation:fu 1s ease .85s both}
.wedding-art .art-line{fill:none;stroke:#d9ad56;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.p-num{font-family:'Cinzel Decorative',serif;font-size:1.7rem;color:var(--cream)}
.p-sep{color:var(--gold);font-size:1.2rem}
.p-mo{color:var(--gold);font-size:.82rem;letter-spacing:3px;font-style:italic}
.h-scr{background:none;border:1px solid rgba(201,150,26,.35);color:var(--gold);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1rem;margin-top:26px;display:inline-flex;align-items:center;justify-content:center;animation:bounce 2s ease infinite,fu .9s ease 1.4s both}

.mp-sub{color:var(--muted);font-size:.85rem;margin-bottom:26px;font-family:'Lato',sans-serif}
.mp-sub.te{font-family:'Noto Serif Telugu',serif;font-size:.88rem}
.dir-b{display:inline-block;background:linear-gradient(135deg,#7c1020 0%,#c43050 45%,#c9961a 100%);color:#fff;padding:15px 34px;border-radius:50px;text-decoration:none;font-family:'Noto Serif',serif;font-size:1.05rem;letter-spacing:.5px;transition:all .3s;box-shadow:0 8px 32px rgba(201,150,26,.25)}

.ftr-o{color:var(--gold);font-size:.7rem;letter-spacing:7px;margin-bottom:20px}
.ftr-t{color:var(--muted);font-style:italic;font-size:1rem;margin-bottom:28px}
.ftr-t.te{font-family:'Noto Serif Telugu',serif;font-size:.96rem;line-height:1.7}
.ftr-nm{font-family:'Cinzel Decorative',serif;color:var(--gold);font-size:1.6rem;margin-bottom:10px}
.ftr-nm.te{font-family:'Noto Serif Telugu',serif;font-size:1.3rem}
.ftr-cp{color:rgba(144,128,160,.35);font-size:.7rem;margin-top:20px}

/* RESPONSIVE */
@media(max-width:480px){
  .h-nm{font-size:2rem}
  .h-nm.te{font-size:1.6rem}
  .cdu{min-width:70px;padding:14px 10px}
  .cdn{font-size:1.8rem}
  .ev-g{grid-template-columns:1fr}
  .mp-b{padding:44px 22px}
  .dr-ctr h1{font-size:1.8rem}
}

/* ── SCRATCH CARD ── */
const ScratchCard=({onDone,t,guest,te})=>{
  const cvRef=useRef(null);
  const down=useRef(false);
  const [pct,setPct]=useState(0);
  const [done,setDone]=useState(false);

  useEffect(()=>{
    const cv=cvRef.current;const ctx=cv.getContext('2d');
    const W=cv.width,H=cv.height;
    const g=ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#380818');g.addColorStop(.35,'#7c1020');
    g.addColorStop(.65,'#c9961a');g.addColorStop(1,'#2d0610');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    // Kolam-like circles
    ctx.strokeStyle='rgba(255,220,120,0.22)';ctx.lineWidth=1;
    [20,45,72,100,128].forEach(r=>{ctx.beginPath();ctx.arc(W/2,H/2,r,0,Math.PI*2);ctx.stroke()});
    // petals
    for(let i=0;i<8;i++){
      const a=(i/8)*Math.PI*2;
      ctx.beginPath();ctx.ellipse(W/2+55*Math.cos(a),H/2+55*Math.sin(a),10,5,a,0,Math.PI*2);
      ctx.fillStyle='rgba(201,150,26,0.15)';ctx.fill();
    }
    ctx.fillStyle='rgba(255,245,200,.9)';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.font='italic bold 14px Noto Serif,Georgia,serif';
    ctx.fillText('✦  Scratch Here  ✦',W/2,H/2-14);
    ctx.font='12px Lato,sans-serif';ctx.fillStyle='rgba(255,240,180,.7)';
    ctx.fillText('Your Invitation Awaits',W/2,H/2+14);
  },[]);

  const pos=(e,cv)=>{
    const r=cv.getBoundingClientRect();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const cy=e.touches?e.touches[0].clientY:e.clientY;
    return{x:(cx-r.left)*(cv.width/r.width),y:(cy-r.top)*(cv.height/r.height)};
  };
  const scratch=useCallback(e=>{
    if(!down.current)return;
    const cv=cvRef.current;const ctx=cv.getContext('2d');
    const{x,y}=pos(e,cv);
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath();ctx.arc(x,y,28,0,Math.PI*2);ctx.fill();
    const d=ctx.getImageData(0,0,cv.width,cv.height).data;
    let cl=0;for(let i=3;i<d.length;i+=4)if(d[i]===0)cl++;
    const p=(cl/(cv.width*cv.height))*100;
    setPct(p);
    if(p>50&&!done){setDone(true);setTimeout(onDone,700);}
  },[done,onDone]);

  return(
    <div className="sc-ov">
      <Particles count={20}/>
      <div className="sc-box">
        <div className="sc-hdr"><span className="sc-orn">❦</span><h2 className="sc-ttl">{t.scrTitle}</h2><span className="sc-orn">❦</span></div>
        {te&&<p className="sc-te">{T.te.scrTitle}</p>}
        {guest&&<p className="sc-guest">{t.dear} {guest},</p>}
        <div className="sc-wrap">
          <div className="sc-bg">
            <div style={{textAlign:'center',padding:'16px'}}>
              <div style={{fontSize:'2.2rem',marginBottom:'8px'}}>💍</div>
              <p style={{color:'rgba(201,150,26,.8)',fontSize:'.78rem',letterSpacing:'2px',marginBottom:'6px'}}>YOU ARE INVITED</p>
              <p style={{fontFamily:'Cinzel Decorative,serif',fontSize:'.95rem',color:'#f5edd6'}}>Yarraboina Manoj Kumar & Siva Keerthi</p>
              <p style={{color:'#9080a0',fontSize:'.76rem',marginTop:'6px'}}>October 30, 2026 · Khammam</p>
            </div>
          </div>
          <canvas ref={cvRef} width={310} height={196} className="sc-cvs"
            onMouseDown={e=>{down.current=true;scratch(e)}} onMouseMove={scratch}
            onMouseUp={()=>{down.current=false}} onMouseLeave={()=>{down.current=false}}
            onTouchStart={e=>{down.current=true;scratch(e)}} onTouchMove={scratch}
            onTouchEnd={()=>{down.current=false}}/>
        </div>
        <div className="sc-bar"><div className="sc-fill" style={{width:`${Math.min(pct,100)}%`}}/></div>
        <p className="sc-hint">{done?'🎉 Opening your invitation...':t.scrHint}</p>
        <button className="skip-b" onClick={onDone}>Skip intro →</button>
      </div>
    </div>
  );
};

      <h2 className={`st${te?' te':''}`}>{t.stTitle}</h2>
      <div className="sw">
        <div className={`sl-card ${an}`} style={{background:s.bg}}>
          <IllSVG idx={idx}/>
          <div className="sl-body">
            <div className="sl-em">{s.em}</div>
            <h3 className={`sl-h${te?' te':''}`}>{caps[s.hi]}</h3>
            <p className={`sl-sub${te?' te':''}`}>{subs[s.hi]}</p>
            <div className="sl-dv" style={{background:s.di}}/>
            <p className={`sl-desc${te?' te':''}`}>{descs[s.hi]}</p>
          </div>
        </div>
        <div className="sl-ctrl">
          <button className="sl-b" onClick={prev}>‹</button>
          <div className="dots2">{SLIDES.map((_,i)=><div key={i} className={`d2${i===idx?' on':''}`} onClick={()=>go(i)}/>)}</div>
          <button className="sl-b" onClick={next}>›</button>
        </div>
      </div>
    </div>
  );
};

/* ── QUOTE ── */
const Quote=({t,te})=>(
  <div className="qt-sec">

      <p className={`qt-t${te?' te':''}`}>{t.quote}</p>
      <p className="qt-a">{t.quoteA}</p>
    </div>

);

/* ── EVENTS ── */
const Events=({t,te})=>(
  <div className="sec">
    <div className="so">♦ ♦ ♦</div>
    <h2 className={`st${te?' te':''}`}>{t.evTitle}</h2>

        <div className="ev-rb">{t.mainTag}</div>
        <div className="ev-n">01</div>

        <div className={`ev-row${te?' te':''}`}><span>📅</span>{t.ev2D}</div>
        <div className={`ev-row${te?' te':''}`}><span>⏰</span>{t.ev2Ti}</div>
        <div className={`ev-row${te?' te':''}`}><span>📍</span>Khammam, Telangana</div>
      </div>
    </div>

);

/* ── MAP ── */
const MapSec=({t,te})=>(
  <div className="sec">
    <div className="so">✦ ✦ ✦</div>
    <h2 className={`st${te?' te':''}`}>{t.venueT}</h2>
    <div className="mp-c">
      <div className="mp-b">
        <div className="mp-pin">📍</div>
        <p className={`mp-vn${te?' te':''}`}>{t.venueName}</p>
        <p className={`mp-sub${te?' te':''}`}>{t.venueSub}</p>
        <a href={WD.venueLink} target="_blank" rel="noopener noreferrer" className={`dir-b${te?' te':''}`}>{t.getDir}</a>
      </div>
    </div>

);

/* ── HERO ── */
const Hero=({t,te,guest})=>(
  <section className="hero">
    <Particles count={32}/>
    <div className="hero-bg" aria-hidden="true">
      <svg viewBox="0 0 700 700" fill="none">
        {[40,80,120,160,200,240,280,320].map((r,i)=><circle key={i} cx="350" cy="350" r={r} stroke="white" strokeWidth=".55"/>)}
        {Array.from({length:24},(_,i)=>{const a=(i/24)*Math.PI*2;return<line key={i} x1="350" y1="350" x2={350+340*Math.cos(a)} y2={350+340*Math.sin(a)} stroke="white" strokeWidth=".45"/>})}
        {[0,30,60,90,120,150,180,210,240,270,300,330].map((a,i)=>{const x=350+240*Math.cos(a*Math.PI/180);const y=350+240*Math.sin(a*Math.PI/180);return<ellipse key={i} cx={x} cy={y} rx="14" ry="7" fill="white" opacity=".03" transform={`rotate(${a} ${x} ${y})`}/>})}
      </svg>
    </div>
    <div className="hero-c">
      {guest&&<p className="h-dear">{t.dear} {guest},</p>}
      <p className={`h-tag${te?' te':''}`}>{t.tag}</p>
      <div className="h-dots"><span>◆</span><span>◆</span><span>◆</span><span>◆</span><span>◆</span></div>
      <svg className="wedding-art" viewBox="0 0 360 230" role="img" aria-label="Golden floral wedding mandap with a bride and groom">
        <path className="art-line" d="M42 202V91Q42 28 180 22Q318 28 318 91V202M58 202V95Q58 44 180 39Q302 44 302 95V202"/>
        <path className="art-line" d="M30 202H330M72 202V112M288 202V112M68 111Q180 80 292 111"/>
        <path className="art-line" d="M82 94Q104 124 126 94Q148 124 170 94Q192 124 214 94Q236 124 258 94Q276 116 292 103"/>
        {[86,130,174,218,262].map((x,i)=><g key={i} transform={`translate(${x} ${i%2?119:113})`}><path className="art-flower" d="M0-7Q-10-14-8-3Q-15 3-4 5Q0 15 4 5Q15 3 8-3Q10-14 0-7Z"/><circle r="2.5" fill="#fff0c4"/></g>)}
        <path className="art-soft" d="M180 178Q160 156 171 139Q180 126 189 139Q200 156 180 178Z"/>
        <path className="art-line" d="M180 170Q157 164 158 151Q171 150 180 163Q189 150 202 151Q203 164 180 170ZM180 178V194M165 194H195"/>
        <circle className="art-couple" cx="151" cy="143" r="10"/><circle className="art-couple" cx="209" cy="143" r="10"/>
        <path className="art-couple" d="M139 156Q151 151 163 156L169 190H133ZM197 156Q209 151 221 156L228 190H190Z"/>
        <path className="art-line" d="M154 153Q180 176 206 153M152 167L180 179L208 167"/>
        <path className="art-line" d="M32 202Q44 189 56 202M304 202Q316 189 328 202"/>
        <path className="art-soft" d="M44 197Q44 187 51 184Q58 187 58 197ZM302 197Q302 187 309 184Q316 187 316 197Z"/>
        <circle cx="180" cy="16" r="3" fill="#f0bb40"/><path className="art-line" d="M173 14Q180 3 187 14M180 20V29"/>
      </svg>
      <div className="h-names">
        <span className={`h-nm nm-g${te?' te':''}`}>{t.groomShort}</span>
        <span className="h-amp">⌖</span>
        <span className={`h-nm nm-b${te?' te':''}`}>{t.brideShort}</span>
      </div>
      <p className={`h-sub${te?' te':''}`}>{t.weds} · {te?'అక్టోబర్ 30, 2026':'October 30, 2026'}</p>
      <div className="h-pill">
        <span className="p-num">30</span>
        <span className="p-sep">·</span>
        <span className="p-mo">{te?'అక్టోబర్':'OCTOBER'} 2026</span>
        <span className="p-sep">·</span>
        <span className="p-mo">8:30 PM</span>
      </div>
      <br/>
      <button className="h-scr" onClick={()=>document.getElementById('cd').scrollIntoView({behavior:'smooth'})}>↓</button>
    </div>
  </section>
);

/* ── FOOTER ── */
const Footer=({t,te})=>(
  <footer className="ftr">
    <div className="ftr-o">✦ ✦ ✦ ✦ ✦</div>
    <p className={`ftr-t${te?' te':''}`}>{t.ftrT}</p>
    <p className={`ftr-nm${te?' te':''}`}>{te?'యర్రబోయిన మనోజ్ కుమార్ & శివకీర్తి':'Yarraboina Manoj Kumar & Siva Keerthi'}</p>
    <div style={{color:'var(--gold)',fontSize:'.8rem',letterSpacing:'5px',margin:'14px 0'}}>❦ ❦ ❦</div>
    <p style={{color:'var(--saffron-l)',fontSize:'.8rem',fontStyle:'italic',marginBottom:'6px'}}>
      {te?'ఖమ్మం, తెలంగాణ · అక్టోబర్ 30, 2026':'Khammam, Telangana · October 30, 2026'}
    </p>
    <p className="ftr-cp">Made with ♥ · A Wedding to Remember Forever</p>
  </footer>
);

/* ── APP ── */
const App=()=>{
  const[phase,setPhase]=useState('scratch');
  const[lang,setLang]=useState('en');
  const[guest,setGuest]=useState('');
  useEffect(()=>{
    try{const p=new URLSearchParams(window.location.search);const n=p.get('name');if(n)setGuest(decodeURIComponent(n));}catch(e){}
  },[]);
  const t=T[lang];const te=lang==='te';
  return(
    <div>
      {phase==='scratch'&&<ScratchCard onDone={()=>setPhase('door')} t={t} guest={guest} te={te}/>}
      {phase==='door'&&<DoorReveal onDone={()=>setPhase('main')}/>}
      {phase==='main'&&(
        <>
          <div className="fctrl">
            <button className="cb lb" onClick={()=>setLang(l=>l==='en'?'te':'en')} title="Toggle Language">
              {lang==='en'?'తెలుగు':'EN'}
            </button>
          </div>
          <Hero t={t} te={te} guest={guest}/>
          <div id="cd"><Countdown t={t} te={te}/></div>
          <Slideshow t={t} te={te}/>
          <Quote t={t} te={te}/>
          <Events t={t} te={te}/>
          <MapSec t={t} te={te}/>
          <Footer t={t} te={te}/>
        </>
      )}
    </div>
  );
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
